name: Verification

# 준비된 신뢰 runner에서 main만 수동 검증한다. 외부 PR 코드는 자동 실행하지 않는다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    if: github.repository == 'hellosunghyun/swift-omni-parser' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, omni-parser-ios27]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select installed Xcode 27
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, os, pathlib, subprocess
          for app in sorted(glob.glob('/Applications/Xcode*.app'), reverse=True):
              developer = str(pathlib.Path(app) / 'Contents/Developer')
              env = dict(os.environ, DEVELOPER_DIR=developer)
              try:
                  version = subprocess.check_output(['xcodebuild', '-version'], env=env, text=True)
                  sdk = subprocess.check_output(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'], env=env, text=True)
              except subprocess.CalledProcessError:
                  continue
              if version.startswith('Xcode 27.') and sdk.startswith('27.'):
                  with open(os.environ['GITHUB_ENV'], 'a') as output:
                      output.write('DEVELOPER_DIR=' + developer + '\n')
                  print(version)
                  break
          else:
              raise SystemExit('::error::Xcode 27 / iOS 27 SDK가 있는 runner가 필요합니다. OS 설정을 낮추거나 검사를 건너뛰지 않습니다.')
          PY
      - name: Lint
        run: |
          command -v swiftlint
          swiftlint version
          test "$(swiftlint version)" = '0.65.1'
          swiftlint lint --strict
      - name: Select iPhone 17 Simulator
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json'], text=True))
          devices = [d for runtime, values in data['devices'].items() if '.iOS-27-' in runtime
                     for d in values if d['name'] == 'iPhone 17']
          if not devices:
              raise SystemExit('::error::iOS 27 iPhone 17 Simulator가 필요합니다.')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('OMNI_SIMULATOR_ID=' + devices[0]['udid'] + '\n')
          PY
      - name: Build and test
        run: |
          xcodebuild test -scheme OmniParser \
            -destination "platform=iOS Simulator,id=$OMNI_SIMULATOR_ID" \
            -packageAuthorizationProvider netrc -skipMacroValidation -parallel-testing-enabled NO \
            -collect-test-diagnostics never CODE_SIGNING_ALLOWED=NO
          xcodebuild build -scheme OmniParser \
            -destination 'generic/platform=iOS Simulator' \
            -packageAuthorizationProvider netrc -skipMacroValidation CODE_SIGNING_ALLOWED=NO
      - name: Verify versioned consumer
        run: bash .github/verify-consumer.sh "$RUNNER_TEMP/OmniParserConsumer"
      - name: Verify distributed archive checksums
        run: bash ThirdParty/OfficeOxide/build.sh --verify
